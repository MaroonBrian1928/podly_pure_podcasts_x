services:
  podly:
    container_name: podly-pure-podcasts
    ports:
      - "5001:5001"
    # image: ghcr.io/podly-pure-podcasts/podly-pure-podcasts:${BRANCH:-main-latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/instance:/app/src/instance
    env_file:
      - ./.env.local
    # All PODLY_RUST_* flags and SERVER_THREADS come from .env.local (loaded
    # above). Only host-shell-overridable defaults that are NOT in .env.local
    # belong here.
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: podly-pure-podcasts-network
