services:
  podly:
    container_name: podly-pure-podcasts
    ports:
      - "5001:5001"
    image: ghcr.io/podly-pure-podcasts/podly-pure-podcasts:${BRANCH:-main-latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/instance:/app/src/instance
    env_file:
      - ./.env.local
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SERVER_THREADS=${SERVER_THREADS:-1}
      - PODLY_RUST_CHAPTERS_ENABLED=${PODLY_RUST_CHAPTERS_ENABLED:-false}
      - PODLY_RUST_FEED_REFRESH_ENABLED=${PODLY_RUST_FEED_REFRESH_ENABLED:-false}
      - PODLY_RUST_JOBS_ENABLED=${PODLY_RUST_JOBS_ENABLED:-false}
      - PODLY_RUST_STATS_ENABLED=${PODLY_RUST_STATS_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: podly-pure-podcasts-network
