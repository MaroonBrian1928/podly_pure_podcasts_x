<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card { text-align: center; max-width: 320px; width: 100%; }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    .title { font-size: 13px; color: #64748b; margin-top: 12px; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">{{ icon }}</div>
    <h1>{{ heading }}</h1>
    <p>{{ body }}</p>
    {% if title %}<p class="title">{{ title }}</p>{% endif %}
  </div>
  {% if close %}<script>setTimeout(function(){window.close();},1500);</script>{% endif %}
</body>
</html>
