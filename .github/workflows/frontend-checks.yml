name: Frontend Lint and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: frontend

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This job always runs so `lint-build` can be a required status check
      # without deadlocking PRs that don't touch the frontend. When no frontend
      # files changed, the heavy steps below are skipped and the job reports
      # success — so runner time stays low while the gate stays enforced.
      - name: Detect frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-checks.yml'

      - name: Set up Node
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Run eslint
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Type check and build
        if: github.event_name == 'push' || steps.filter.outputs.frontend == 'true'
        run: npm run build
