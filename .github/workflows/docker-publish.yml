name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_amd64:
        description: Build AMD64 image
        type: boolean
        default: true
      build_arm64:
        description: Build ARM64 image
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_files.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for documentation-only changes
        id: check_files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags origin "$BASE_REF"
            BASE_SHA=$(git rev-parse "origin/$BASE_REF")
            HEAD_SHA=$(git rev-parse "${{ github.sha }}")
            files_changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "release" ]; then
            files_changed="manual-trigger"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            files_changed=$(git diff --name-only HEAD~1 HEAD)
          else
            files_changed=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          echo "Files changed:"
          echo "$files_changed"

          non_doc_files=$(echo "$files_changed" | grep -v -E '(\.md$|^docs/|LICENCE)' || true)

          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$non_doc_files" ]; then
            echo "Only documentation files were changed. Skipping build and publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  build-pr:
    needs: changes
    if: ${{ needs.changes.outputs.skip == 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0

      - name: Build PR image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64

  build-arch:
    needs: changes
    if: ${{ needs.changes.outputs.skip == 'false' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            enabled_input: build_amd64
          - arch: arm64
            platform: linux/arm64
            enabled_input: build_arm64
    outputs:
      tag_prefix: ${{ steps.tags.outputs.tag_prefix }}
    steps:
      - name: Determine if this architecture is selected
        id: select
        run: |
          enabled=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ matrix.enabled_input }}" in
              build_amd64) enabled="${{ github.event.inputs.build_amd64 }}" ;;
              build_arm64) enabled="${{ github.event.inputs.build_arm64 }}" ;;
            esac
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout repository
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Set image tags
        if: ${{ steps.select.outputs.enabled == 'true' }}
        id: tags
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          image_name="$(echo "${{ github.repository_owner }}/podly-pure-podcasts" | tr '[:upper:]' '[:lower:]')"
          echo "tag_prefix=$ref_name" >> "$GITHUB_OUTPUT"
          echo "arch_tag=${{ env.REGISTRY }}/${image_name}:${ref_name}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0

      - name: Log in to Container Registry
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.arch_tag }}

  publish-manifest:
    needs: build-arch
    if: ${{ github.event_name != 'pull_request' && always() && needs.build-arch.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        id: manifest
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          image_name="$(echo "${{ github.repository_owner }}/podly-pure-podcasts" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${image_name}"
          sources=()
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.build_amd64 }}" = "true" ]; then
            sources+=("${image}:${ref_name}-amd64")
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.build_arm64 }}" = "true" ]; then
            sources+=("${image}:${ref_name}-arm64")
          fi

          # Tags applied to the multi-arch manifest.
          tags=("${ref_name}-latest")

          # On a release / version tag (vX.Y.Z), also publish the clean
          # version (X.Y.Z) and the rolling `latest` tag.
          version=""
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          fi
          version="${version#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            tags+=("$version" "latest")
          fi

          tag_args=()
          for t in "${tags[@]}"; do
            tag_args+=("-t" "${image}:${t}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          # Resolve the published digest for use in the release notes.
          digest="$(docker buildx imagetools inspect "${image}:${tags[0]}" --format '{{.Manifest.Digest}}')"

          {
            echo "image=$image"
            echo "version=$version"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Attach image details to the release
        if: ${{ github.event_name == 'release' && steps.manifest.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          image="${{ steps.manifest.outputs.image }}"
          version="${{ steps.manifest.outputs.version }}"
          digest="${{ steps.manifest.outputs.digest }}"

          body="$(gh release view "$tag" --json body --jq .body)"
          if printf '%s' "$body" | grep -q '<!-- docker-image -->'; then
            echo "Release notes already contain the Docker image section; skipping."
            exit 0
          fi

          {
            printf '%s\n\n' "$body"
            echo '<!-- docker-image -->'
            echo '## Docker image'
            echo
            echo '```'
            echo "docker pull ${image}:${version}"
            echo "docker pull ${image}:latest"
            echo '```'
            echo
            echo "Digest: \`${digest}\`"
          } > release_notes.md
          gh release edit "$tag" --notes-file release_notes.md
        shell: bash
