name: Build and Publish Docker Images

# Publishing happens on:
#   - the "Release" workflow completing successfully (semantic-release just cut
#     a new vX.Y.Z tag). This is the automatic path: `workflow_run` is allowed
#     to fire here because the Release run was started by a real push to main,
#     not by the GITHUB_TOKEN.
#   - a manual `vX.Y.Z` tag push.
#   - a manual `workflow_dispatch` run (point it at a tag for clean version tags).
#
# Released images are tagged with the exact version (X.Y.Z), the rolling major
# tag (<major>.x, e.g. 2.x), and `latest`.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_amd64:
        description: Build AMD64 image
        type: boolean
        default: true
      build_arm64:
        description: Build ARM64 image
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Release run concluded '${{ github.event.workflow_run.conclusion }}'; skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="${{ github.event.workflow_run.head_sha }}"
            if git tag --points-at "$sha" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Found a version tag on $sha; publishing."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No new version tag on $sha; nothing to publish."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  build-arch:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            enabled_input: build_amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            enabled_input: build_arm64
    steps:
      - name: Determine if this architecture is selected
        id: select
        run: |
          enabled=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ matrix.enabled_input }}" in
              build_amd64) enabled="${{ github.event.inputs.build_amd64 }}" ;;
              build_arm64) enabled="${{ github.event.inputs.build_arm64 }}" ;;
            esac
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout repository
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set image tags
        if: ${{ steps.select.outputs.enabled == 'true' }}
        id: tags
        run: |
          image_name="$(echo "${{ github.repository_owner }}/podly-pure-podcasts" | tr '[:upper:]' '[:lower:]')"
          source scripts/resolve_image_version.sh
          echo "arch_tag=${{ env.REGISTRY }}/${image_name}:${prefix}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0

      - name: Log in to Container Registry
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        if: ${{ steps.select.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.arch_tag }}

  publish-manifest:
    needs: build-arch
    if: ${{ always() && needs.build-arch.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        id: manifest
        run: |
          image_name="$(echo "${{ github.repository_owner }}/podly-pure-podcasts" | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${image_name}"
          source scripts/resolve_image_version.sh

          sources=()
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.build_amd64 }}" = "true" ]; then
            sources+=("${image}:${prefix}-amd64")
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.build_arm64 }}" = "true" ]; then
            sources+=("${image}:${prefix}-arm64")
          fi

          # Tags applied to the multi-arch manifest.
          tags=()
          if [ -n "$version" ]; then
            major="${version%%.*}"
            tags+=("$version" "${major}.x" "latest")
          else
            # Non-release build (e.g. manual dispatch off a branch): keep a
            # single rolling per-ref tag.
            tags+=("${prefix}-latest")
          fi

          tag_args=()
          for t in "${tags[@]}"; do
            tag_args+=("-t" "${image}:${t}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          # Resolve the published digest for use in the release notes.
          digest="$(docker buildx imagetools inspect "${image}:${tags[0]}" --format '{{.Manifest.Digest}}')"

          {
            echo "image=$image"
            echo "version=$version"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Attach image details to the release
        if: ${{ steps.manifest.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.manifest.outputs.version }}"
          image="${{ steps.manifest.outputs.image }}"
          version="${{ steps.manifest.outputs.version }}"
          digest="${{ steps.manifest.outputs.digest }}"
          major="${version%%.*}"

          if ! body="$(gh release view "$tag" --json body --jq .body 2>/dev/null)"; then
            echo "No GitHub release found for $tag; skipping release-note update."
            exit 0
          fi
          if printf '%s' "$body" | grep -q '<!-- docker-image -->'; then
            echo "Release notes already contain the Docker image section; skipping."
            exit 0
          fi

          {
            printf '%s\n\n' "$body"
            echo '<!-- docker-image -->'
            echo '## Docker image'
            echo
            echo '```'
            echo "docker pull ${image}:${version}"
            echo "docker pull ${image}:${major}.x"
            echo "docker pull ${image}:latest"
            echo '```'
            echo
            echo "Digest: \`${digest}\`"
          } > release_notes.md
          gh release edit "$tag" --notes-file release_notes.md
        shell: bash
