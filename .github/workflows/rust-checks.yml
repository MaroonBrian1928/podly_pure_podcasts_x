name: Rust Format, Lint, Build, and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: rust

jobs:
  fmt-clippy-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This job always runs so `fmt-clippy-build-test` can be a required status
      # check without deadlocking PRs that don't touch rust/. When no rust files
      # changed, the heavy steps below are skipped and the job reports success.
      - name: Detect rust changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/rust-checks.yml'

      - name: Set up Rust toolchain
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust

      - name: Check formatting
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        run: cargo fmt --check

      - name: Run clippy
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        run: cargo build --locked

      - name: Run tests
        if: github.event_name == 'push' || steps.filter.outputs.rust == 'true'
        run: cargo test --locked
