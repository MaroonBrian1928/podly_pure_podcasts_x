services:
  podly:
    container_name: podly-pure-podcasts
    ports:
      - "5001:5001"
    image: ghcr.io/podly-pure-podcasts/podly-pure-podcasts:${BRANCH:-main-latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/instance:/app/src/instance
    env_file:
      - ./.env.local
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SERVER_THREADS=${SERVER_THREADS:-1}
      - PODLY_RUST_TOOLS_BIN=${PODLY_RUST_TOOLS_BIN:-/app/bin/podly_tools}
      - PODLY_RUST_AUDIO_ENABLED=${PODLY_RUST_AUDIO_ENABLED:-false}
      - PODLY_RUST_FEED_XML_ENABLED=${PODLY_RUST_FEED_XML_ENABLED:-false}
      - PODLY_RUST_TRANSCRIPT_ENABLED=${PODLY_RUST_TRANSCRIPT_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  parakeetx-cuda:
    image: ghcr.io/maroonbrian1928/parakeetx:cuda
    env_file:
      - path: .parakeetx.env
        required: false
    environment:
      PARAKEET__DEVICE: ${PARAKEET__DEVICE_CUDA:-cuda}
      DIARIZATION__DEVICE: ${DIARIZATION__DEVICE_CUDA:-cpu}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    ports:
      - "${HOST_PORT_CUDA:-7373}:${UVICORN_PORT:-7317}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
  ina-segmenter:
    image: ghcr.io/maroonbrian1928/InaFastAPI:latest
    ports:
      - "8002:8000"
    volumes:
      - model-cache:/root/.cache
    restart: unless-stopped


networks:
  default:
    name: podly-pure-podcasts-network

volumes:
  model-cache:
